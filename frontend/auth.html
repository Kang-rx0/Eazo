<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>值夜 · 登录</title>
  <link rel="stylesheet" href="nightwatch.css">
</head>
<body>
  <!-- V3 P2：登录/注册换肤（差异清单 ②-27）：free-text-field + 主按钮 + note 说明，逻辑不变。
       成功后按 /api/state 的 view 决定去 onboarding 还是主界面（文档 7.1）。 -->
  <header class="topbar">
    <div class="badge">
      <div class="face" data-mood="happy" aria-hidden="true"><i class="l"></i><i class="r"></i><u></u></div>
      <div>
        <b>值夜</b>
        <s>今晚值班</s>
      </div>
    </div>
  </header>

  <main class="screens">
    <section class="screen" id="s-auth" data-active>
      <div class="body">
        <p class="tag">先对上号</p>
        <h1>你的账号</h1>
        <p class="sub">记录存在账号下，换台设备也接得上。</p>

        <div class="editgroup">
          <p>用户名</p>
          <input class="field" id="username" autocomplete="username" placeholder="起一个你记得住的名字">
        </div>
        <div class="editgroup">
          <p>密码</p>
          <input class="field" id="password" type="password" autocomplete="current-password" placeholder="别太复杂，够用就行">
        </div>

        <!-- 错误提示：文案表意，不靠颜色单独表意（DESIGN.md「状态不靠颜色单独表意」） -->
        <p class="note" id="msg" role="alert" hidden></p>
      </div>
      <div class="foot">
        <button class="btn primary" type="button" id="loginBtn" onclick="submitAuth('/api/login')">登录</button>
        <button class="btn ghost" type="button" id="registerBtn" onclick="submitAuth('/api/register')">第一次来，注册并进入</button>
        <button class="textlink" type="button" onclick="location.href='index.html'">回介绍页看看</button>
      </div>
    </section>
  </main>

  <script>
    async function submitAuth(url) {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');
      msg.hidden = true; msg.textContent = '';
      const login = document.getElementById('loginBtn');
      const register = document.getElementById('registerBtn');
      login.disabled = register.disabled = true;   // 防双击
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          msg.textContent = data.error || '出错了，再试一次';
          msg.hidden = false;
          return;
        }
        localStorage.setItem('token', data.token);
        // 拿到 token 后问后端该去哪个视图（文档 7.1）
        const state = await (await fetch('/api/state', {
          headers: { 'Authorization': 'Bearer ' + data.token },
        })).json();
        location.href = state.view === 'onboarding' ? 'onboarding.html' : 'app.html';
      } catch (e) {
        msg.textContent = '连不上服务，稍后再试一次';
        msg.hidden = false;
      } finally {
        login.disabled = register.disabled = false;
      }
    }
    // 回车提交：低精力时刻少一次寻找按钮
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitAuth('/api/login');
    });
  </script>
</body>
</html>
