<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主界面</title>
  <style>
    /* 只保证结构清晰、按钮能点，精致 UI 由队友负责 */
    body { max-width: 640px; margin: 0 auto; padding: 16px; }
    #offwork-btn { font-size: 22px; padding: 18px 48px; }
    .card { border: 1px solid #ccc; border-radius: 10px; padding: 16px; margin: 12px 0; }
    .small-btns button { margin: 4px 6px 4px 0; }
    #clock-bar {
      position: fixed; right: 12px; bottom: 12px;
      background: rgba(0, 0, 0, 0.6); color: #fff;
      padding: 8px 12px; border-radius: 8px; font-size: 13px;
    }
    #clock-bar button { margin-left: 6px; }
    #loading { color: #666; }
    #toast {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      background: #2a7; color: #fff; padding: 8px 18px; border-radius: 8px;
      font-size: 14px; display: none; z-index: 10; max-width: 90%;
    }
    #toast.err { background: #c33; }
  </style>
</head>
<body>
  <!-- 操作结果提示：所有修改/保存/确认成功后都在这里明确告知 -->
  <div id="toast"></div>

  <h1>今晚</h1>

  <!-- V2：下班提醒条（到设定下班点弹出；「还没」半小时后再问一次，再没有就不问了） -->
  <div id="offwork-reminder" style="display:none; padding:8px 12px; background:#fff8e6; border:1px solid #e6d9a8; margin-bottom:12px;">
    到点了，下班了吗？
    <button onclick="reminderYes()">下班了</button>
    <button onclick="reminderNo()">还没</button>
  </div>

  <!-- home 视图：大按钮「下班了」（文档 3.2） -->
  <div id="home-view" style="display:none;">
    <p><button id="offwork-btn" onclick="offwork()">下班了</button></p>
  </div>

  <!-- V2：生成前先问一句今晚状态（选完再生成；语义与一击纠正一致） -->
  <div id="state-view" style="display:none;" class="card">
    <h2>今晚状态怎么样？</h2>
    <div class="small-btns">
      <button onclick="pickState('今天还行')">今天还行</button>
      <button onclick="pickState('今晚更累')">今晚更累</button>
      <button onclick="pickState('时间更少')">时间更少</button>
      <button onclick="pickState('不太舒服')">不太舒服</button>
    </div>
    <p style="font-size:12px;"><a href="javascript:void(0)" onclick="pickState(null)">跳过，直接生成</a></p>
  </div>

  <!-- 回执视图：第二天点「下班了」先收昨晚回执（文档 7.2） -->
  <div id="feedback-view" style="display:none;" class="card">
    <h2 id="fb-question"></h2>
    <div class="small-btns">
      <button onclick="sendFeedback('完成了')">完成了</button>
      <button onclick="sendFeedback('只完成一部分')">只完成一部分</button>
      <button onclick="sendFeedback('完全没完成')">完全没完成</button>
      <button onclick="sendFeedback('建议仍然太难')">建议仍然太难</button>
      <button onclick="sendFeedback('跳过')">跳过</button>
    </div>
  </div>

  <!-- advice 视图：建议卡片 + 接受 + 一击纠正（文档 3.2 / 7.2） -->
  <div id="advice-view" style="display:none;">
    <!-- 昨晚回执可改（点错了后悔的回退入口） -->
    <p id="yesterday-line" style="display:none; font-size:13px; color:#666;">
      昨晚记为：<span id="yesterday-fb"></span>
      <a href="javascript:void(0)" onclick="reopenFeedback()">点错了？改</a>
    </p>
    <div class="card">
      <h2>今晚的最低线</h2>
      <p><strong id="adv-judgement"></strong></p>
      <p id="adv-reason" style="color:#666;"></p>
      <ul>
        <li id="adv-eat"></li>
        <li id="adv-move"></li>
        <li id="adv-stop"></li>
      </ul>
      <!-- V2 安全模式：不建议做什么 + 就医提醒（语气温和，不是红色警报） -->
      <div id="adv-avoid-wrap" style="display:none;">
        <p style="margin:4px 0; color:#8a6d3b;">今晚先不：</p>
        <ul id="adv-avoid-list" style="color:#8a6d3b; margin-top:0;"></ul>
      </div>
      <p id="adv-see-doctor" style="display:none; color:#a05252;"></p>
      <p id="adv-severe-notice" style="display:none; color:#a05252;"></p>
      <p id="adv-disclaimer" style="display:none; font-size:12px; color:#999;"></p>
      <p id="adv-sources" style="font-size:12px; color:#999;"></p>
      <p><button onclick="accept()">就这样</button> <span id="accept-msg" style="color:#2a7;"></span></p>
    </div>
    <!-- Agent 过程可视化（文档 9.4，演示加分项）：折叠面板展示工具调用轨迹 -->
    <details id="trace-panel" style="font-size:13px; color:#666; margin:8px 0;">
      <summary>它是怎么得出这个建议的</summary>
      <ol id="trace-steps"></ol>
      <p id="trace-meta" style="font-size:12px; color:#999;"></p>
    </details>
    <div class="small-btns">
      不对？一击纠正：
      <button onclick="correct('今晚更累')">今晚更累</button>
      <button onclick="correct('时间更少')">时间更少</button>
      <button onclick="correct('不太舒服')">不太舒服</button>
      <button onclick="correct('今天还行')">今天还行</button>
      <button onclick="correct('其实我做了')">其实我做了</button>
    </div>
    <!-- V2：难度微调（安全模式下不显示「加一点」——运动本来就被撤了） -->
    <div class="small-btns" style="margin-top:4px;">
      难度：
      <button onclick="correct('难度再低一点')">再轻一点</button>
      <button id="harder-btn" onclick="correct('难度再高一点')">再加一点</button>
    </div>
  </div>

  <!-- V2 S4：严重疾病温和劝退视图（语气抱歉而非拒斥，保留改资料的出口） -->
  <div id="rejected-view" style="display:none;" class="card">
    <h2>抱歉，这里帮不上你</h2>
    <p id="rejected-msg"></p>
    <p style="font-size:13px; color:#666;">
      如果是选错了或情况有变，可以去<a href="onboarding.html?edit=1&sec=ob-4">我的资料</a>里修改。
    </p>
  </div>

  <!-- 补充一句 / 拍一下（文档 3.2 / 7.3；不做成首屏主角） -->
  <div id="input-bar" style="display:none; margin-top:16px;">
    <input id="free-text" placeholder="补充一句：加班了 / 中午吃了什么…" size="36">
    <button onclick="sendFreeInput()">发送</button>
    <label style="margin-left:8px; cursor:pointer; text-decoration:underline;">
      拍一下<input id="meal-photo" type="file" accept="image/*" style="display:none;" onchange="uploadMealPhoto()">
    </label>
    <div id="input-msg" style="color:#2a7;"></div>
  </div>

  <p id="loading" style="display:none;">正在想今晚怎么安排，大约十几秒…</p>
  <p style="margin-top:24px;">
    <a href="onboarding.html?edit=1">我的资料</a> ·
    <a href="index.html" onclick="localStorage.removeItem('token')">退出登录</a>
  </p>

  <!-- 演示控制条（文档第八节） -->
  <div id="clock-bar">
    <span id="clock-display">加载中…</span>
    <button onclick="changeClock({advance_hours: 1})">+1小时</button>
    <button onclick="changeClock({advance_days: 1})">下一天</button>
    <button onclick="changeClock({reset: true})">重置</button>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = 'auth.html';
    const AUTH = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };

    function show(viewId) {
      for (const id of ['home-view', 'feedback-view', 'advice-view', 'rejected-view', 'state-view']) {
        document.getElementById(id).style.display = id === viewId ? 'block' : 'none';
      }
      // 自由输入框在 home / advice 视图都可用，回执/状态/劝退视图收起
      document.getElementById('input-bar').style.display =
        (viewId === 'home-view' || viewId === 'advice-view') ? 'block' : 'none';
    }

    function setLoading(on) {
      document.getElementById('loading').style.display = on ? 'block' : 'none';
    }

    // 所有修改/保存/确认成功后都用它明确告知用户
    let toastTimer = null;
    function toast(msg, isErr) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = isErr ? 'err' : '';
      el.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.style.display = 'none', 4000);
    }

    // 昨晚回执状态行：显示已选项 + 「点错了？改」
    let yesterdayFb = null;   // {record_id, feedback, advice}
    function renderYesterdayLine(yf) {
      yesterdayFb = yf;
      const line = document.getElementById('yesterday-line');
      if (!yf) { line.style.display = 'none'; return; }
      document.getElementById('yesterday-fb').textContent = yf.feedback;
      line.style.display = 'block';
    }

    // 「点错了？改」：重新打开回执四档屏
    function reopenFeedback() {
      if (!yesterdayFb) return;
      const a = yesterdayFb.advice || {};
      document.getElementById('fb-question').textContent =
        `昨晚「${a.move || a.stop || a.judgement || '的建议'}」做得怎么样？`;
      document.getElementById('feedback-view').dataset.recordId = yesterdayFb.record_id;
      show('feedback-view');
    }

    async function api(path, body) {
      const res = await fetch(path, { method: 'POST', headers: AUTH, body: JSON.stringify(body || {}) });
      if (res.status === 401) { localStorage.removeItem('token'); location.href = 'auth.html'; return null; }
      return res.json();
    }

    // 开屏先问后端该显示什么（文档 7.1）
    let lastState = null;
    async function refreshState() {
      const res = await fetch('/api/state', { headers: AUTH });
      if (res.status === 401) { localStorage.removeItem('token'); location.href = 'auth.html'; return; }
      const state = await res.json();
      lastState = state;
      if (state.view === 'onboarding') { location.href = 'onboarding.html'; return; }
      document.getElementById('clock-display').textContent = state.virtual_now_display;
      if (state.view === 'rejected') {
        document.getElementById('rejected-msg').textContent = state.message || '';
        show('rejected-view');
        return;
      }
      renderYesterdayLine(state.yesterday_feedback);
      if (state.view === 'advice') { renderAdvice(state.today_advice); show('advice-view'); }
      else show('home-view');
      checkOffworkReminder(state);
    }

    // ---- V2：下班提醒（到设定下班点弹一条；「还没」30 分钟后再问一次；再没有就不问了）----
    let profileOffworkEnd = null;   // "19:00"
    async function loadProfileForReminder() {
      const res = await fetch('/api/profile', { headers: AUTH });
      if (res.ok) profileOffworkEnd = ((await res.json()).profile || {}).off_work_end || null;
    }

    function reminderStore(vday, patch) {
      const cur = JSON.parse(localStorage.getItem('offworkReminder') || '{}');
      const rec = cur.vday === vday ? cur : { vday, asked: 0, nextAskAt: null, done: false };
      Object.assign(rec, patch || {});
      localStorage.setItem('offworkReminder', JSON.stringify(rec));
      return rec;
    }

    function checkOffworkReminder(state) {
      // 只在「还没生成今晚建议」的 home 视图提醒；虚拟时间由后端给
      const bar = document.getElementById('offwork-reminder');
      if (!profileOffworkEnd || state.view !== 'home' || state.today_advice) {
        bar.style.display = 'none';
        return;
      }
      const now = new Date(state.virtual_now);
      const [h, m] = profileOffworkEnd.split(':').map(Number);
      const end = new Date(state.virtual_now); end.setHours(h, m, 0, 0);
      const rec = reminderStore(state.vday);
      if (rec.done || rec.asked >= 2 || now < end) { bar.style.display = 'none'; return; }
      if (rec.nextAskAt && now < new Date(rec.nextAskAt)) { bar.style.display = 'none'; return; }
      bar.style.display = 'block';
    }

    function reminderYes() {
      reminderStore(lastState.vday, { done: true });
      document.getElementById('offwork-reminder').style.display = 'none';
      offwork();
    }

    function reminderNo() {
      const rec = reminderStore(lastState.vday);
      const next = new Date(new Date(lastState.virtual_now).getTime() + 30 * 60 * 1000);
      reminderStore(lastState.vday, {
        asked: rec.asked + 1,
        nextAskAt: rec.asked + 1 >= 2 ? null : next.toISOString(),   // 问满两次就不再问
      });
      document.getElementById('offwork-reminder').style.display = 'none';
    }

    // 每 30 秒拉一次状态：驱动提醒条 + 时钟显示跟随虚拟时间（演示拨时钟后无需手动刷新）
    setInterval(async () => {
      if (document.getElementById('state-view').style.display === 'block') return;   // 别打断选择
      const res = await fetch('/api/state', { headers: AUTH });
      if (!res.ok) return;
      const state = await res.json();
      lastState = state;
      document.getElementById('clock-display').textContent = state.virtual_now_display;
      if (state.view === 'home') checkOffworkReminder(state);
      else document.getElementById('offwork-reminder').style.display = 'none';
    }, 30000);

    // 「下班了」（V2 改版）：生成前先问一句今晚状态；可能先要收昨晚回执（文档 7.2）
    let pickedState;   // 本次「下班了」选的状态（回执流程结束后继续用）
    function offwork() {
      pickedState = undefined;
      show('state-view');
      document.getElementById('offwork-reminder').style.display = 'none';
    }

    // 选完状态（null=跳过）→ 真正调用生成
    async function pickState(state) {
      pickedState = state;
      await doOffwork();
    }

    async function doOffwork() {
      setLoading(true);
      const data = await api('/api/offwork', pickedState ? { state: pickedState } : {});
      setLoading(false);
      if (!data) return;
      if (data.rejected) { await refreshState(); return; }   // 劝退用户：转劝退视图
      if (data.need_feedback) {
        const a = data.record.advice || {};
        document.getElementById('fb-question').textContent =
          `昨晚「${a.move || a.stop || a.judgement || '的建议'}」做得怎么样？`;
        document.getElementById('feedback-view').dataset.recordId = data.record.record_id;
        show('feedback-view');
        return;
      }
      renderAdvice(data.advice); show('advice-view');
    }

    // 回执四档/跳过 → 写库；首次紧接着生成今晚建议，改回执时可能按新档位重出建议
    async function sendFeedback(fb) {
      const recordId = Number(document.getElementById('feedback-view').dataset.recordId);
      setLoading(true);
      const data = await api('/api/feedback', { record_id: recordId, feedback: fb });
      setLoading(false);
      if (!data || data.error) { toast((data && data.error) || '提交失败，请重试', true); return; }
      if (yesterdayFb && yesterdayFb.record_id === recordId) yesterdayFb.feedback = fb;
      renderYesterdayLine(yesterdayFb || { record_id: recordId, feedback: fb, advice: null });
      if (data.advice) {
        // 改回执导致档位变化，今晚建议已按新档位重新生成
        renderAdvice(data.advice); show('advice-view');
        toast(`已改为「${fb}」，今晚建议已按新档位重新生成 ✓`);
      } else if (currentAdvice) {
        // 改回执但档位没变：回到建议卡片
        show('advice-view');
        toast(`已记下：${fb} ✓`);
      } else {
        // 首次回执：紧接着生成今晚建议（沿用「下班了」时已选的状态）
        toast(`已记下：${fb} ✓`);
        await doOffwork();
      }
    }

    // 一击纠正 / 难度微调 → 重跑建议
    async function correct(type) {
      setLoading(true);
      const data = await api('/api/correct', { type });
      setLoading(false);
      if (data && data.rejected) { await refreshState(); return; }   // 劝退用户
      if (data && data.message && !data.new_level) {
        // 难度已到边界：不重新生成，只提示
        toast(data.message);
        return;
      }
      if (data && data.advice) {
        renderAdvice(data.advice); show('advice-view');
        if (data.yesterday_updated) {
          // 「其实我做了」顺手把昨晚回执改成了完成了
          if (yesterdayFb) { yesterdayFb.feedback = '完成了'; renderYesterdayLine(yesterdayFb); }
          toast('已把昨晚记为「完成了」，档位重算，建议已更新 ✓');
        } else {
          toast(`已按「${type}」重新生成 ✓`);
        }
      } else {
        toast((data && data.error) || '重新生成失败，请重试', true);
      }
    }

    // 自由输入 → 当天已有建议就重出，否则轻确认
    async function sendFreeInput() {
      const input = document.getElementById('free-text');
      const text = input.value.trim();
      if (!text) return;
      setLoading(true);
      const data = await api('/api/free_input', { text });
      setLoading(false);
      if (!data) return;
      if (data.error) { toast(data.error, true); return; }
      if (data.rejected) { await refreshState(); return; }   // 劝退用户：转劝退视图
      input.value = '';
      if (data.advice) {
        renderAdvice(data.advice); show('advice-view');
        // 自由输入触发严重疾病标记：当晚仍显示安全模式建议，同时明确告知产品不适用
        toast(data.advice.severe_notice
              ? data.advice.severe_notice
              : '已把这句话考虑进去，建议已更新 ✓', !!data.advice.severe_notice);
      } else {
        toast(data.message || '已记下 ✓');
      }
    }

    // 食物照片：识别 → 存为当日饮食记录 → 轻确认 + 可删除回退（文档 7.3）
    async function uploadMealPhoto() {
      const input = document.getElementById('meal-photo');
      if (!input.files.length) return;
      const form = new FormData();
      form.append('file', input.files[0]);
      const msg = document.getElementById('input-msg');
      msg.textContent = '认一下这是什么…';
      const res = await fetch('/api/meal/photo', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },   // FormData 不手动设 Content-Type
        body: form,
      });
      const data = await res.json();
      input.value = '';
      if (!res.ok || !data.ok) {
        msg.textContent = '';
        toast(data.error || '没认出来，晚点再试', true);
        return;
      }
      // 轻确认 + 「记错了？删除」（识别错/传错图的回退）
      msg.textContent = '';
      const confirmSpan = document.createElement('span');
      confirmSpan.textContent = data.message + ' ';
      const delBtn = document.createElement('a');
      delBtn.href = 'javascript:void(0)';
      delBtn.textContent = '记错了？删除';
      delBtn.onclick = async () => {
        const d = await api('/api/meal/delete', { meal_id: data.meal_id });
        msg.textContent = '';
        if (d && d.ok) toast(d.message + ' ✓');
        else toast((d && d.error) || '删除失败', true);
      };
      msg.replaceChildren(confirmSpan, delBtn);
      setTimeout(() => { if (msg.contains(confirmSpan)) msg.textContent = ''; }, 15000);
    }

    // 接受：界面停在建议卡片，反馈动作发生在下一次触点（文档 7.2）
    function accept() {
      document.getElementById('accept-msg').textContent = '好，今晚就这样。有变化随时回来改。';
    }

    // 拉最近一次 Agent 轨迹填进折叠面板（文档 9.4）
    async function loadTrace() {
      const res = await fetch('/api/agent_trace', { headers: AUTH });
      if (!res.ok) return;
      const data = await res.json();
      const ol = document.getElementById('trace-steps');
      ol.innerHTML = '';
      if (!data.trace) return;
      for (const s of data.trace.steps) {
        const li = document.createElement('li');
        li.textContent = s;
        ol.appendChild(li);
      }
      document.getElementById('trace-meta').textContent =
        `本次思考用时 ${data.trace.duration_s ?? '?'} 秒 · ${data.trace.virtual_time ?? ''}`;
    }

    // 按行渲染建议卡片：null 的行不显示；safety_flag 时只显示休息/就医提示（文档 5.2）
    let currentAdvice = null;
    function renderAdvice(a) {
      currentAdvice = a;
      loadTrace();   // 每次建议更新都同步刷新轨迹面板
      document.getElementById('accept-msg').textContent = '';
      const set = (id, text) => {
        const el = document.getElementById(id);
        el.style.display = text ? '' : 'none';
        el.textContent = text || '';
      };
      // V2 起统一渲染：安全模式下 eat/move 已被后端 L3 置空，avoid/see_doctor 由后端拼好，
      // 前端只负责展示（危机时整卡已被替换为求助文案，同样走这条路径）
      set('adv-judgement', a.judgement);
      set('adv-reason', a.reason);
      set('adv-eat', a.eat ? '吃：' + a.eat : null);
      set('adv-move', a.move ? '动：' + a.move : null);
      set('adv-stop', a.stop ? '停：' + a.stop : null);
      const avoid = a.avoid || [];
      document.getElementById('adv-avoid-wrap').style.display = avoid.length ? '' : 'none';
      const avoidList = document.getElementById('adv-avoid-list');
      avoidList.innerHTML = '';
      for (const item of avoid) {
        const li = document.createElement('li');
        li.textContent = item;
        avoidList.appendChild(li);
      }
      set('adv-see-doctor', a.see_doctor);
      set('adv-severe-notice', a.severe_notice);
      set('adv-disclaimer', a.disclaimer);
      set('adv-sources', a.sources && a.sources.length ? '参考依据：' + a.sources.join('、') : null);
      // 安全模式下不显示「再加一点」：运动本来就被撤了，加量按钮只会带来困惑
      document.getElementById('harder-btn').style.display =
        (a.safety_level && a.safety_level !== 'none') ? 'none' : '';
    }

    // 时间变化后重新拉 /api/state，界面随之切换（文档第八节）
    async function changeClock(payload) {
      await fetch('/api/clock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      await refreshState();
    }

    loadProfileForReminder().then(refreshState);
  </script>
</body>
</html>
