<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>填写信息</title>
  <style>
    /* 最小结构样式，精致 UI 由队友负责 */
    fieldset { margin-bottom: 12px; }
    label { margin-right: 12px; }
  </style>
</head>
<body>
  <!-- onboarding 表单，兼作「我的资料」编辑页（?edit=1 时预填现有值） -->
  <h1 id="page-title">首次进入 · 花一分钟告诉我你的日常</h1>
  <p id="back-link" style="display:none;"><a href="app.html">← 返回主界面</a></p>

  <fieldset>
    <legend>一般几点下班？</legend>
    <label>从
      <select id="off_work_start">
        <option>17:00</option><option>17:30</option><option selected>18:00</option>
        <option>18:30</option><option>19:00</option><option>20:00</option><option>21:00</option>
      </select>
    </label>
    <label>到
      <select id="off_work_end">
        <option>18:00</option><option>18:30</option><option selected>19:00</option>
        <option>19:30</option><option>20:00</option><option>21:00</option><option>22:00</option>
      </select>
    </label>
    <label>加班频率
      <select id="overtime_freq">
        <option>几乎不加班</option><option selected>偶尔加班</option><option>经常加班</option>
      </select>
    </label>
  </fieldset>

  <fieldset>
    <legend>通勤单程大概多久？</legend>
    <select id="commute_min">
      <option value="10">10 分钟以内</option>
      <option value="20">20 分钟左右</option>
      <option value="30" selected>30 分钟左右</option>
      <option value="45">45 分钟左右</option>
      <option value="60">1 小时左右</option>
      <option value="90">1 个半小时以上</option>
    </select>
  </fieldset>

  <fieldset>
    <legend>上班时身体状态？</legend>
    <label><input type="radio" name="work_body_state" value="久坐" checked> 基本久坐</label>
    <label><input type="radio" name="work_body_state" value="站着走动"> 站着/常走动</label>
    <label><input type="radio" name="work_body_state" value="体力消耗"> 体力消耗大</label>
  </fieldset>

  <fieldset>
    <legend>晚上能做饭吗？</legend>
    <label><input type="radio" name="cooking" value="只能外卖" checked> 只能外卖</label>
    <label><input type="radio" name="cooking" value="能简单做"> 能简单做点</label>
    <label><input type="radio" name="cooking" value="能正经做"> 能正经做饭</label>
  </fieldset>

  <fieldset>
    <legend>饮食禁忌（可多选，可跳过）</legend>
    <label><input type="checkbox" name="diet" value="不吃辣"> 不吃辣</label>
    <label><input type="checkbox" name="diet" value="海鲜过敏"> 海鲜过敏</label>
    <label><input type="checkbox" name="diet" value="乳糖不耐受"> 乳糖不耐受</label>
    <label><input type="checkbox" name="diet" value="素食"> 素食</label>
    <label><input type="checkbox" name="diet" value="不吃牛羊肉"> 不吃牛羊肉</label>
  </fieldset>

  <!-- V2：爱吃的食物类别（软参考——顺着爱好给"最轻的改法"，不没收爱好） -->
  <fieldset>
    <legend>平时爱吃什么？（可多选，可跳过——我们不没收爱好，只帮你吃得舒服点）</legend>
    <label><input type="checkbox" name="fav" value="粉面类"> 粉面类（螺蛳粉/拌粉/汤面）</label>
    <label><input type="checkbox" name="fav" value="炸物快餐"> 炸物快餐（炸鸡/汉堡/薯条）</label>
    <label><input type="checkbox" name="fav" value="盖饭便当"> 盖饭/便当/米饭类</label><br>
    <label><input type="checkbox" name="fav" value="火锅麻辣烫"> 火锅/麻辣烫/串</label>
    <label><input type="checkbox" name="fav" value="烧烤夜宵"> 烧烤/夜宵</label>
    <label><input type="checkbox" name="fav" value="甜品奶茶"> 甜品/奶茶/饮料</label><br>
    <label><input type="checkbox" name="fav" value="轻食沙拉"> 轻食/沙拉</label>
    <label><input type="checkbox" name="fav" value="家常菜"> 自己做的家常菜</label>
  </fieldset>

  <fieldset>
    <legend>平时几点起床？（用来倒推今晚几点该停）</legend>
    <select id="wake_time">
      <option>06:00</option><option>06:30</option><option selected>07:00</option>
      <option>07:30</option><option>08:00</option><option>08:30</option><option>09:00</option>
    </select>
  </fieldset>

  <fieldset>
    <legend>有需要注意的健康问题吗？（一行，可跳过）</legend>
    <input id="health_note" placeholder="比如：腰不好 / 胃不太好" size="40">
  </fieldset>

  <!-- V2 安全边界（S4，2026-08-08 改版）：确诊疾病自由填写，分类判断全在后台词表做 -->
  <fieldset>
    <legend>有确诊的疾病吗？（例如：高血压、2型糖尿病，没有可跳过）</legend>
    <input id="chronic_condition" size="40" placeholder="自己的话写就行，比如：高血压五六年了"
           oninput="chronicChanged()">
    <div id="doctor-advice-wrap" style="display:none; margin-top:6px;">
      医生对你的饮食/运动有过嘱咐吗？填了我们会严格照着来。（可跳过）<br>
      <textarea id="doctor_advice" rows="3" cols="46" placeholder="比如：晚餐主食减半，不做剧烈运动，饭后可散步"></textarea>
    </div>
  </fieldset>

  <fieldset>
    <legend>运动基础</legend>
    <select id="exercise_base">
      <option selected>无/偶尔</option><option>每周1-2次</option><option>每周3次以上</option>
    </select>
  </fieldset>

  <fieldset>
    <legend>可选：用于估算量级的参数（全部可跳过）</legend>
    <label>性别
      <select id="gender">
        <option value="">不填</option><option value="男">男</option><option value="女">女</option>
      </select>
    </label>
    <label>年龄 <input id="age" type="number" min="14" max="99" style="width:4em"></label>
    <label>身高cm <input id="height_cm" type="number" min="120" max="230" style="width:5em"></label>
    <label>体重kg <input id="weight_kg" type="number" min="30" max="200" style="width:5em"></label>
  </fieldset>

  <p><button id="submit-btn" onclick="submitOnboarding()">完成，进入主界面</button></p>
  <p id="msg" style="color: #c00;"></p>
  <p id="success-msg" style="display:none; color: #2a7;">已保存 ✓（修改资料不会自动重出今晚建议，可回主界面用「一击纠正」或补一句话让它重新想）</p>

  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = 'auth.html';   // 未登录先去登录

    // ?edit=1 时是「我的资料」编辑模式：预填现有值，保存后不跳转、不重出建议
    const editMode = new URLSearchParams(location.search).has('edit');
    if (editMode) {
      document.getElementById('page-title').textContent = '我的资料';
      document.getElementById('submit-btn').textContent = '保存修改';
      document.getElementById('back-link').style.display = 'block';
      prefill();
    }

    function radioValue(name) {
      return document.querySelector(`input[name="${name}"]:checked`).value;
    }

    // 填了病况就展开医嘱框（分不分类由后台词表判断，前端不做任何判断）
    function chronicChanged() {
      const filled = document.getElementById('chronic_condition').value.trim() !== '';
      document.getElementById('doctor-advice-wrap').style.display = filled ? 'block' : 'none';
    }

    // 编辑模式：用现有档案预填表单
    async function prefill() {
      const res = await fetch('/api/profile', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) return;
      const p = (await res.json()).profile;
      if (!p) return;
      const setVal = (id, v) => { if (v != null) document.getElementById(id).value = v; };
      setVal('off_work_start', p.off_work_start);
      setVal('off_work_end', p.off_work_end);
      setVal('overtime_freq', p.overtime_freq);
      setVal('commute_min', p.commute_min);
      setVal('wake_time', p.wake_time);
      setVal('exercise_base', p.exercise_base);
      setVal('health_note', p.health_note || '');
      setVal('gender', p.gender || '');
      setVal('age', p.age); setVal('height_cm', p.height_cm); setVal('weight_kg', p.weight_kg);
      for (const name of ['work_body_state', 'cooking']) {
        const el = document.querySelector(`input[name="${name}"][value="${p[name]}"]`);
        if (el) el.checked = true;
      }
      const diets = (p.diet_restrictions || '').split(',');
      for (const el of document.querySelectorAll('input[name="diet"]')) {
        el.checked = diets.includes(el.value);
      }
      const favs = (p.favorite_foods || '').split(',');
      for (const el of document.querySelectorAll('input[name="fav"]')) {
        el.checked = favs.includes(el.value);
      }
      // 病况预填：原文回显（旧格式"严重疾病：xxx"去掉前缀，只显示 xxx）
      const cc = p.chronic_condition || '';
      setVal('chronic_condition', cc.startsWith('严重疾病：') ? cc.slice(5) : cc);
      setVal('doctor_advice', p.doctor_advice || '');
      chronicChanged();
    }

    async function submitOnboarding() {
      const diet = [...document.querySelectorAll('input[name="diet"]:checked')]
        .map(el => el.value).join(',');
      // 可选数字项：没填就传 null，后端 calc_body_metrics 会因缺项而不可用（符合文档设计）
      const num = id => document.getElementById(id).value ? Number(document.getElementById(id).value) : null;
      const payload = {
        off_work_start: document.getElementById('off_work_start').value,
        off_work_end: document.getElementById('off_work_end').value,
        overtime_freq: document.getElementById('overtime_freq').value,
        commute_min: Number(document.getElementById('commute_min').value),
        work_body_state: radioValue('work_body_state'),
        cooking: radioValue('cooking'),
        diet_restrictions: diet || null,
        health_note: document.getElementById('health_note').value.trim() || null,
        wake_time: document.getElementById('wake_time').value,
        exercise_base: document.getElementById('exercise_base').value,
        gender: document.getElementById('gender').value || null,
        age: num('age'),
        height_cm: num('height_cm'),
        weight_kg: num('weight_kg'),
        chronic_condition: document.getElementById('chronic_condition').value.trim() || null,
        doctor_advice: document.getElementById('doctor_advice').value.trim() || null,
        favorite_foods: [...document.querySelectorAll('input[name="fav"]:checked')]
          .map(el => el.value).join(',') || null,
      };
      // 只保存档案（首夜建议由用户在主界面点「下班了」触发）
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('msg').textContent = '';
      document.getElementById('success-msg').style.display = 'none';
      const res = await fetch('/api/onboarding', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify(payload),
      });
      document.getElementById('submit-btn').disabled = false;
      if (!res.ok) {
        document.getElementById('msg').textContent = '保存失败，请重试';
        return;
      }
      const data = await res.json();
      if (editMode || data.updated) {
        // 明确告知保存成功，留在本页
        document.getElementById('success-msg').style.display = 'block';
        return;
      }
      location.href = 'app.html';
    }
  </script>
</body>
</html>
